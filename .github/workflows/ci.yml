name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: web-console/package-lock.json

      - run: uv sync --frozen
      - run: scripts/install_kubernetes_tools.sh "${RUNNER_TEMP}/k8s-tools"
      - run: echo "${RUNNER_TEMP}/k8s-tools" >> "${GITHUB_PATH}"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: helm lint deploy/helm/trpc-agent-platform
      - run: uv run pytest tests/deployment/test_helm_contract.py
      - run: >-
          uv run pytest tests/unit
          --cov=trpc_service.version
          --cov=dev.fake_external.scenarios
          --cov-branch
          --cov-fail-under=80
          --cov-report=term-missing
      - run: uv run python scripts/export_openapi.py

      - run: npm ci
        working-directory: web-console
      - run: npm run generate:api
        working-directory: web-console
      - run: git diff --exit-code -- docs/contracts/admin-api.openapi.json web-console/src/generated/admin-api.ts
      - run: npm run format:check
        working-directory: web-console
      - run: npm run typecheck
        working-directory: web-console
      - run: npm run test:coverage
        working-directory: web-console
      - run: npm run build
        working-directory: web-console

  public-boundary-smoke:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: web-console/package-lock.json
      - run: npm ci
        working-directory: web-console
      - run: npx playwright install --with-deps chromium
        working-directory: web-console
      - run: docker compose up --build --wait
      - run: npm run test:smoke
        working-directory: web-console
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  kubernetes-production-smoke:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: scripts/install_kubernetes_tools.sh "${RUNNER_TEMP}/k8s-tools"
      - run: echo "${RUNNER_TEMP}/k8s-tools" >> "${GITHUB_PATH}"
      - run: uv run pytest tests/deployment/test_kubernetes_smoke.py -v -s
        env:
          RUN_KUBERNETES_SMOKE: "1"
