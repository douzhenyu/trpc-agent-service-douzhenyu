name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_DB: trpc_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trpc_platform"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: web-console/package-lock.json

      - run: uv sync --frozen
      - run: scripts/install_kubernetes_tools.sh "${RUNNER_TEMP}/k8s-tools"
      - run: echo "${RUNNER_TEMP}/k8s-tools" >> "${GITHUB_PATH}"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: helm lint deploy/helm/trpc-agent-platform
      - run: uv run pytest tests/deployment/test_helm_contract.py tests/deployment/test_zero_trust_contract.py
      - run: >-
          uv run pytest tests/unit tests/integration
          --cov=trpc_service
          --cov=dev.fake_external.scenarios
          --cov-branch
          --cov-fail-under=80
          --cov-report=term-missing
          -q
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/trpc_platform
          TEST_DATABASE_URL: postgresql://trpc_platform_app:app-password@127.0.0.1:5432/trpc_platform
      - run: >-
          uv run coverage report
          --include=trpc_service/admin_api/auth.py,trpc_service/admin_api/preconditions.py,trpc_service/admin_api/roles.py
          --fail-under=90
      - run: >-
          uv run coverage report
          --include=trpc_service/admin_api/database.py
          --fail-under=90
      - run: >-
          uv run coverage report
          --include=trpc_service/admin_api/idempotency.py
          --fail-under=90
      - run: >-
          uv run coverage report
          --include=trpc_service/database_migrations.py,trpc_service/migrations/*.py,trpc_service/migrations/versions/*.py
          --fail-under=90
      - run: >-
          uv run coverage report
          --include=trpc_service/budgets.py
          --fail-under=90
      - run: uv run python scripts/export_openapi.py

      - run: npm ci
        working-directory: web-console
      - run: npm run generate:api
        working-directory: web-console
      - run: git diff --exit-code -- docs/contracts/admin-api.openapi.json web-console/src/generated/admin-api.ts
      - run: npm run format:check
        working-directory: web-console
      - run: npm run typecheck
        working-directory: web-console
      - run: npm run test:coverage
        working-directory: web-console
      - run: npm run build
        working-directory: web-console

  public-boundary-smoke:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: web-console/package-lock.json
      - run: npm ci
        working-directory: web-console
      - run: npx playwright install --with-deps chromium
        working-directory: web-console
      - run: docker compose up --build --wait
      - run: npm run test:smoke
        working-directory: web-console
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  kubernetes-production-smoke:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: scripts/install_kubernetes_tools.sh "${RUNNER_TEMP}/k8s-tools"
      - run: echo "${RUNNER_TEMP}/k8s-tools" >> "${GITHUB_PATH}"
      - run: uv run pytest tests/deployment/test_kubernetes_smoke.py -v -s
        env:
          RUN_KUBERNETES_SMOKE: "1"
