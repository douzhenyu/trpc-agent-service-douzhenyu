[project]
name = "trpc-agent-service"
version = "0.1.0"
description = "Multi-tenant tRPC-Agent platform"
requires-python = "==3.12.*"
dependencies = [
  "alembic==1.19.1",
  "asyncpg==0.31.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "pwdlib[argon2]==0.3.1",
  "pyjwt[crypto]==2.13.0",
  "pydantic-settings==2.10.1",
  "sqlalchemy[asyncio]==2.0.52",
  "trpc-agent-py==1.1.19",
  "uvicorn[standard]==0.35.0",
  "ag-ui-protocol==0.1.22",
  "a2a-sdk==0.3.22",
  "protobuf==6.33.0",
  "langgraph==1.2.11",
]

[project.scripts]
admin-api = "trpc_service.admin_api.__main__:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "pyyaml==6.0.3",
  "ruff==0.12.9",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trpc_service"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
  "ignore::Warning:pydantic._internal._generate_schema",
  "ignore::pydantic.warnings.PydanticDeprecatedSince20:trpc_agent_sdk\\..*",
]
testpaths = ["tests"]
markers = [
  "integration: tests that require a real PostgreSQL instance",
  "smoke: black-box tests against a running platform",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["trpc_service", "dev.fake_external"]

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "trpc_agent_sdk.*"
ignore_missing_imports = true
