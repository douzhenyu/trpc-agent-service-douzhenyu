[project]
name = "trpc-agent-service"
version = "0.1.0"
description = "Multi-tenant tRPC-Agent platform"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.116.1",
  "pydantic-settings==2.10.1",
  "trpc-agent-py==1.1.19",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]
admin-api = "trpc_service.admin_api.__main__:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.9",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trpc_service"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "smoke: black-box tests against a running platform",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["trpc_service", "dev.fake_external"]
