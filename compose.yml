name: trpc-agent-platform

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: trpc_platform
      POSTGRES_USER: trpc_platform
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./dev/postgres/init.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trpc_platform -d trpc_platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=redpanda:9092
    ports:
      - "19092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  opa:
    image: openpolicyagent/opa:1.4.2-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    ports:
      - "8181:8181"
    volumes:
      - ./dev/opa:/policies:ro
    healthcheck:
      test: ["CMD", "/opa", "eval", "true"]
      interval: 5s
      timeout: 3s
      retries: 20

  fake-external:
    build:
      context: .
      dockerfile: dev/fake_external/Dockerfile
    ports:
      - "8090:8090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  database-migration:
    build:
      context: .
      dockerfile: Dockerfile.admin-api
    command: ["/app/.venv/bin/python", "-m", "trpc_service.database_migrations"]
    environment:
      DATABASE_ADMIN_URL: postgresql://trpc_platform:local-development-only@postgres:5432/trpc_platform
      DATABASE_APP_PASSWORD: app-password
    depends_on:
      postgres:
        condition: service_healthy

  admin-api:
    build:
      context: .
      dockerfile: Dockerfile.admin-api
    environment:
      DATABASE_URL: postgresql://trpc_platform_app:app-password@postgres:5432/trpc_platform
      SESSION_SIGNING_KEY: local-session-signing-key-change-before-production
      SESSION_COOKIE_SECURE: "false"
      EMERGENCY_ADMIN_USERNAME: emergency-admin
      EMERGENCY_ADMIN_PASSWORD_HASH: "$$argon2id$$v=19$$m=65536,t=3,p=4$$MRV7DB8RCvU73jcYXzxkUA$$z7yjdKaXuCwuYoWzAqb25/+4f8tW5j3cxFm/pComAo4"
      OIDC_ENABLED: "false"
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      S3_ENDPOINT_URL: http://minio:9000
      OPA_URL: http://opa:8181
      FAKE_EXTERNAL_URL: http://fake-external:8090
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      database-migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      opa:
        condition: service_healthy
      fake-external:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web-console:
    build:
      context: ./web-console
    ports:
      - "4173:8080"
    depends_on:
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  minio-data:
  postgres-data:
