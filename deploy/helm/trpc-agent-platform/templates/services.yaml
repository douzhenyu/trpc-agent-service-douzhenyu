{{- range $name, $component := .Values.components }}
{{- if $component.enabled }}
{{- if eq $component.workloadKind "Rollout" }}
{{- range $role := list "stable" "canary" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-{{ $role }}
{{- if $.Values.zeroTrust.enabled }}
  annotations:
    # A Service has no endpoints before its workload exists. Creating it early
    # lets Istio accept targetRef policies before any Pod can receive traffic.
    argocd.argoproj.io/sync-wave: "-3"
{{- end }}
  labels:
    app.kubernetes.io/name: {{ include "trpc-agent-platform.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
    app.kubernetes.io/service-role: {{ $role }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ $component.port }}
      targetPort: http-health
      protocol: TCP
{{- if eq $name "agent-gateway" }}
    - name: http-llm
      port: 8001
      targetPort: http-llm
      protocol: TCP
{{- end }}
---
{{- end }}
{{- else }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
{{- if $.Values.zeroTrust.enabled }}
  annotations:
    # A Service has no endpoints before its workload exists. Creating it early
    # lets Istio accept targetRef policies before any Pod can receive traffic.
    argocd.argoproj.io/sync-wave: "-3"
{{- end }}
  labels:
    app.kubernetes.io/name: {{ include "trpc-agent-platform.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ $component.port }}
      targetPort: http-health
      protocol: TCP
{{- if eq $name "agent-gateway" }}
    - name: http-llm
      port: 8001
      targetPort: http-llm
      protocol: TCP
{{- end }}
---
{{- end }}
{{- end }}
{{- end }}
