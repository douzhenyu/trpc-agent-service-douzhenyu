{{- range $name, $component := .Values.components }}
{{- if $component.enabled }}
{{- if eq $component.workloadKind "Rollout" }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ include "trpc-agent-platform.fullname" $ }}-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ include "trpc-agent-platform.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
spec:
{{- if eq $component.workloadKind "Rollout" }}
  progressDeadlineAbort: true
  rollbackWindow:
    revisions: 3
  strategy:
    canary:
      stableService: {{ $name }}-stable
      canaryService: {{ $name }}-canary
      steps:
        - setWeight: 10
        - pause:
            duration: {{ $.Values.global.rollout.firstPause }}
        - analysis:
            templates:
              - templateName: {{ include "trpc-agent-platform.fullname" $ }}-{{ $name }}
            args:
              - name: health-url
                value: http://{{ $name }}-canary.{{ $.Release.Namespace }}.svc:{{ $component.port }}{{ $component.healthPath }}
              - name: expected-service
                value: {{ $name }}
        - setWeight: 50
        - pause:
            duration: {{ $.Values.global.rollout.secondPause }}
{{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "trpc-agent-platform.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      serviceAccountName: {{ include "trpc-agent-platform.fullname" $ }}-{{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 3
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ $name }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ $name }}
      containers:
        - name: {{ $name }}
          image: {{ include "trpc-agent-platform.image" (dict "root" $ "component" $component) | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
{{- if and (ne $name "admin-api") (ne $name "web-console") }}
          command:
            - /app/.venv/bin/uvicorn
          args:
            - trpc_service.runtime_health:app
            - --host
            - 0.0.0.0
            - --port
            - {{ $component.port | quote }}
          env:
            - name: PLATFORM_UNIT
              value: {{ $name | quote }}
{{- end }}
          ports:
            - name: http-health
              containerPort: {{ $component.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ $component.healthPath }}
              port: http-health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ $component.healthPath }}
              port: http-health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: {{ $component.healthPath }}
              port: http-health
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
{{ toYaml $.Values.global.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
{{- if eq $name "web-console" }}
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
{{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- if eq $name "web-console" }}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
{{- end }}
---
{{- end }}
{{- end }}
