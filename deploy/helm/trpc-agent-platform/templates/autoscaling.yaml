{{- range $name, $component := .Values.components }}
{{- if $component.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "trpc-agent-platform.fullname" $ }}-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ include "trpc-agent-platform.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
spec:
  scaleTargetRef:
{{- if eq $component.workloadKind "Rollout" }}
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
{{- else }}
    apiVersion: apps/v1
    kind: Deployment
{{- end }}
    name: {{ include "trpc-agent-platform.fullname" $ }}-{{ $name }}
  minReplicas: {{ $component.autoscaling.minReplicas }}
  maxReplicas: {{ $component.autoscaling.maxReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
{{- end }}
{{- end }}
