{{- range $name, $component := .Values.components }}
{{- if $component.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ include "trpc-agent-platform.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
automountServiceAccountToken: {{ eq $name "agent-worker" }}
---
{{- end }}
{{- end }}
